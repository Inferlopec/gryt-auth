# Inferlo identity stack: Keycloak + Gryt Identity Service
# Pure add-on to the existing infrastructure:
#  - ports are published on 127.0.0.1 only (not visible externally, firewall untouched)
#  - Caddy (host network) proxies auth.inferlo.xyz / id.inferlo.xyz
name: inferlo-identity

services:
  postgres:
    image: postgres:16-alpine@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663
    container_name: inferlo-identity-postgres
    environment:
      POSTGRES_DB: ${GRYT_AUTH_POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${GRYT_AUTH_POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${GRYT_AUTH_POSTGRES_PASSWORD:?set in .env}
    volumes:
      - inferlo-identity-postgres-data:/var/lib/postgresql/data
    networks:
      - inferlo-identity
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${GRYT_AUTH_POSTGRES_USER:-keycloak} -d ${GRYT_AUTH_POSTGRES_DB:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.3@sha256:5a236ae4dd8ece77490115bace15a11a4d15e9cbcf58a490b95a7da2cd71d32a
    container_name: inferlo-identity-keycloak
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${GRYT_KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${GRYT_KEYCLOAK_ADMIN_PASSWORD:?set in .env}

      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${GRYT_AUTH_POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${GRYT_AUTH_POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${GRYT_AUTH_POSTGRES_PASSWORD}

      # Caddy terminates TLS and sends X-Forwarded-*
      KC_HOSTNAME: ${GRYT_KEYCLOAK_HOSTNAME_URL:-https://auth.inferlo.xyz}
      KC_HOSTNAME_ADMIN: ${GRYT_KEYCLOAK_HOSTNAME_ADMIN_URL:-https://auth.inferlo.xyz}
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: ${GRYT_KEYCLOAK_TRUSTED_PROXIES:-127.0.0.1}

      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"

      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_MANAGEMENT_PORT: "9000"
      KC_HTTP_MANAGEMENT_SCHEME: "http"

      KC_FEATURES: user-event-metrics,update-email,recovery-codes
      KC_EVENT_METRICS_USER_ENABLED: "true"
    command: ["start"]
    ports:
      - "127.0.0.1:${GRYT_KEYCLOAK_PORT:-18080}:8080"
    volumes:
      # In-app device pairing (POST /realms/gryt/gryt-pairing/approve). Build it with
      # keycloak-pairing/build.sh first: a missing jar becomes a directory here, and
      # Keycloak then refuses to start. scripts/preflight.sh checks for it.
      - ./keycloak-pairing/dist/gryt-pairing.jar:/opt/keycloak/providers/gryt-pairing.jar:ro
    networks:
      - inferlo-identity
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
    healthcheck:
      test: ["CMD-SHELL", "{ printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep -q '200 OK'; } 0<>/dev/tcp/localhost/9000"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # Explicit initialization only. The Admin API creates a missing realm;
  # an existing realm is never replaced during normal startup.
  keycloak-import:
    image: python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
    profiles: ["initialize"]
    depends_on:
      keycloak:
        condition: service_healthy
    environment: &admin-environment
      KC_URL: http://keycloak:8080
      GRYT_REALM: ${GRYT_REALM:-gryt}
      GRYT_OIDC_EXTRA_REDIRECT_URIS: ${GRYT_OIDC_EXTRA_REDIRECT_URIS:-[]}
      GRYT_OIDC_EXTRA_WEB_ORIGINS: ${GRYT_OIDC_EXTRA_WEB_ORIGINS:-[]}
      GRYT_KEYCLOAK_ADMIN_USERNAME: ${GRYT_KEYCLOAK_ADMIN_USERNAME:-admin}
      GRYT_KEYCLOAK_ADMIN_PASSWORD: ${GRYT_KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      GRYT_VERIFY_EMAIL: ${GRYT_VERIFY_EMAIL:-false}
      GRYT_RESET_PASSWORD_ALLOWED: ${GRYT_RESET_PASSWORD_ALLOWED:-false}
      GRYT_SMTP_HOST: ${GRYT_SMTP_HOST:-}
      GRYT_SMTP_PORT: ${GRYT_SMTP_PORT:-587}
      GRYT_SMTP_FROM: ${GRYT_SMTP_FROM:-}
      GRYT_SMTP_FROM_NAME: ${GRYT_SMTP_FROM_NAME:-Inferlo}
      GRYT_SMTP_REPLY_TO: ${GRYT_SMTP_REPLY_TO:-}
      GRYT_SMTP_REPLY_TO_NAME: ${GRYT_SMTP_REPLY_TO_NAME:-}
      GRYT_SMTP_USER: ${GRYT_SMTP_USER:-}
      GRYT_SMTP_PASS: ${GRYT_SMTP_PASS:-}
    entrypoint: ["python", "/bootstrap/initialize_realm.py"]
    volumes: &bootstrap-volumes
      - ./bootstrap:/bootstrap:ro
      - ./realm:/realm:ro
    networks: [inferlo-identity]
    restart: "no"
    deploy: &job-limits
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  keycloak-smtp:
    image: python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
    profiles: ["configure"]
    environment: *admin-environment
    entrypoint: ["python", "/bootstrap/configure_smtp.py"]
    volumes: *bootstrap-volumes
    networks: [inferlo-identity]
    restart: "no"
    deploy: *job-limits

  keycloak-email-policy:
    image: python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
    profiles: ["configure"]
    environment: *admin-environment
    entrypoint: ["python", "/bootstrap/configure_email_policy.py"]
    volumes: *bootstrap-volumes
    networks: [inferlo-identity]
    restart: "no"
    deploy: *job-limits

  keycloak-client-policy:
    image: python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
    profiles: ["configure"]
    environment: *admin-environment
    entrypoint: ["python", "/bootstrap/configure_client.py"]
    volumes: *bootstrap-volumes
    networks: [inferlo-identity]
    restart: "no"
    deploy: *job-limits

  keycloak-client-access:
    image: python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
    profiles: ["configure"]
    environment: *admin-environment
    entrypoint: ["python", "/bootstrap/configure_client_access.py"]
    volumes: *bootstrap-volumes
    networks: [inferlo-identity]
    restart: "no"
    deploy: *job-limits

  keycloak-themes:
    image: python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
    profiles: ["configure"]
    environment: *admin-environment
    entrypoint: ["python", "/bootstrap/configure_themes.py"]
    volumes: *bootstrap-volumes
    networks: [inferlo-identity]
    restart: "no"
    deploy: *job-limits

  # One-shot: brute-force protection, password policy, failed sign-in log.
  # Hits the live Keycloak admin API; idempotent, safe to re-run.
  keycloak-security-policy:
    image: curlimages/curl:8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
    profiles: ["configure"]
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KC_URL: http://keycloak:8080
      GRYT_REALM: ${GRYT_REALM:-gryt}
      GRYT_KEYCLOAK_ADMIN_USERNAME: ${GRYT_KEYCLOAK_ADMIN_USERNAME:-admin}
      GRYT_KEYCLOAK_ADMIN_PASSWORD: ${GRYT_KEYCLOAK_ADMIN_PASSWORD}
      GRYT_KC_FAILURE_FACTOR: ${GRYT_KC_FAILURE_FACTOR:-8}
      GRYT_KC_WAIT_INCREMENT_SECONDS: ${GRYT_KC_WAIT_INCREMENT_SECONDS:-60}
      GRYT_KC_MAX_WAIT_SECONDS: ${GRYT_KC_MAX_WAIT_SECONDS:-900}
      GRYT_KC_MAX_DELTA_SECONDS: ${GRYT_KC_MAX_DELTA_SECONDS:-43200}
      GRYT_KC_PASSWORD_POLICY: ${GRYT_KC_PASSWORD_POLICY:-length(12) and notUsername and notEmail}
    entrypoint: ["sh", "/bootstrap/apply_security_policy.sh"]
    volumes:
      - ./bootstrap/apply_security_policy.sh:/bootstrap/apply_security_policy.sh:ro
    networks:
      - inferlo-identity
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  # One-shot: turns on the OAuth device grant for gryt-web (in-app device linking).
  # Read-modify-write on the client, safe to run twice. The realm import already ships
  # the device-grant attributes, so this is the post-import guarantee (and the upgrade
  # path for realms imported before they existed). Run it explicitly after any import:
  #   docker compose run --rm --no-deps keycloak-device-grant
  keycloak-device-grant:
    image: python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
    container_name: inferlo-identity-keycloak-device-grant
    profiles: ["device-grant"]
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KC_URL: http://keycloak:8080
      GRYT_REALM: ${GRYT_REALM:-gryt}
      GRYT_CLIENT_ID: ${GRYT_OIDC_CLIENT_ID:-gryt-web}
      GRYT_KEYCLOAK_ADMIN_USERNAME: ${GRYT_KEYCLOAK_ADMIN_USERNAME:-admin}
      GRYT_KEYCLOAK_ADMIN_PASSWORD: ${GRYT_KEYCLOAK_ADMIN_PASSWORD}
      GRYT_DEVICE_CODE_LIFESPAN: ${GRYT_DEVICE_CODE_LIFESPAN:-300}
      GRYT_DEVICE_POLLING_INTERVAL: ${GRYT_DEVICE_POLLING_INTERVAL:-5}
    entrypoint: ["python", "/bootstrap/enable_device_grant.py"]
    volumes:
      - ./bootstrap/enable_device_grant.py:/bootstrap/enable_device_grant.py:ro
    networks:
      - inferlo-identity
    restart: "no"
    deploy: *job-limits

  # Gryt Identity Service: CA, signs EC P-256 device certificates for users.
  # Source vendored from https://github.com/Gryt-chat/auth/tree/main/identity (AGPL-3.0,
  # see identity/VENDOR.md for the pinned commit).
  identity:
    build:
      context: ./identity
      dockerfile: Dockerfile
    container_name: inferlo-identity-service
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      PORT: "3000"
      GRYT_OIDC_ISSUER: ${GRYT_OIDC_ISSUER:-https://auth.inferlo.xyz/realms/gryt}
      GRYT_OIDC_AUDIENCE: ${GRYT_OIDC_AUDIENCE:-gryt-web}
      GRYT_IDENTITY_ORIGIN: ${GRYT_IDENTITY_ORIGIN:-https://id.inferlo.xyz}
      GRYT_CA_PRIVATE_KEY_FILE: ${GRYT_CA_PRIVATE_KEY_FILE:-}
      GRYT_IDENTITY_DATA_DIR: /app/data
      GRYT_CERT_LIFETIME_DAYS: ${GRYT_CERT_LIFETIME_DAYS:-30}
      # learn: records each account's seed key; enforce: refuses new keys until linked
      GRYT_ACCOUNT_KEY_GATE: ${GRYT_ACCOUNT_KEY_GATE:-learn}
      # Only these addresses may set CF-Connecting-IP (pairing rate limiting).
      # Set the actual source address seen inside Docker (often the bridge gateway).
      GRYT_PAIRING_TRUSTED_PROXIES: ${GRYT_PAIRING_TRUSTED_PROXIES:-}
    ports:
      - "127.0.0.1:${GRYT_IDENTITY_PORT:-18081}:3000"
    volumes:
      - inferlo-identity-data:/app/data
    networks:
      - inferlo-identity
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Cron backups of Postgres (the Keycloak DB) — the only way to restore
  # accounts after an accidental realm re-import. The dump is verified before it is renamed.
  pg-backup:
    image: postgres:16-alpine@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663
    container_name: inferlo-identity-pg-backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${GRYT_AUTH_POSTGRES_DB:-keycloak}
      PGUSER: ${GRYT_AUTH_POSTGRES_USER:-keycloak}
      PGPASSWORD: ${GRYT_AUTH_POSTGRES_PASSWORD}
      BACKUP_RETAIN_DAYS: ${BACKUP_RETAIN_DAYS:-30}
      BACKUP_MIN_BYTES: "10000"
      BACKUP_CRON: ${BACKUP_CRON:-0 */6 * * *}
    entrypoint:
      - sh
      - -c
      - |
        cat > /usr/local/bin/pg-backup.sh <<'SCRIPT'
        #!/bin/sh
        # Dump uncompressed first (we check pg_dump's exit code, not gzip's),
        # then verify size and gzip integrity, and only then rename into place.
        # Pruning old files happens only after a verified dump from this run.
        set -eu
        umask 077
        ts=$$(date -u +%Y%m%dT%H%M%SZ)
        final="/backups/keycloak-$${ts}.sql.gz"
        raw="/backups/.keycloak-$${ts}.sql"
        part="$${final}.part"
        trap 'rm -f "$${raw}" "$${part}"' EXIT
        echo "[pg-backup] $$(date -u +%FT%TZ) Creating $${final}"
        if ! pg_dump > "$${raw}"; then
          echo "[pg-backup] FAILED: pg_dump exited non-zero. Existing backups left alone." >&2
          exit 1
        fi
        size=$$(wc -c < "$${raw}" | tr -d ' ')
        if [ "$${size}" -lt "$${BACKUP_MIN_BYTES}" ]; then
          echo "[pg-backup] FAILED: dump is $${size} bytes, under the $${BACKUP_MIN_BYTES} floor. Existing backups left alone." >&2
          exit 1
        fi
        gzip -c "$${raw}" > "$${part}"
        if ! gzip -t "$${part}"; then
          echo "[pg-backup] FAILED: the archive does not decompress. Existing backups left alone." >&2
          exit 1
        fi
        mv "$${part}" "$${final}"
        echo "[pg-backup] Done ($$(du -h "$${final}" | cut -f1), from $${size} bytes)"
        find /backups -name 'keycloak-*.sql.gz' -mtime +"$${BACKUP_RETAIN_DAYS}" -delete -print \
          | while read f; do echo "[pg-backup] Pruned $${f}"; done
        SCRIPT
        chmod +x /usr/local/bin/pg-backup.sh
        /usr/local/bin/pg-backup.sh
        echo "$${BACKUP_CRON} /usr/local/bin/pg-backup.sh >> /proc/1/fd/1 2>&1" | crontab -
        echo "[pg-backup] Scheduled ($${BACKUP_CRON}). Waiting..."
        exec crond -f -l 6
    volumes:
      # Defaults to beside the compose file. Point it at a mount from somewhere
      # else and the dumps stop sharing a filesystem with the database they exist
      # to restore — which is the failure that matters here.
      - ${GRYT_AUTH_BACKUP_DIR:-./backups}:/backups
    networks:
      - inferlo-identity
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

networks:
  inferlo-identity:
    name: inferlo-identity

volumes:
  inferlo-identity-postgres-data:
  inferlo-identity-data:
